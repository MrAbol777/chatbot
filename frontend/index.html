    <style>
      @font-face { font-family:IRANSansWeb; src:url('%BASE_URL%fonts/iransens/IRANSansWeb_Regular.woff2') format('woff2'); font-weight:400; font-style:normal; font-display:swap }
      @font-face { font-family:IRANSansWeb; src:url('%BASE_URL%fonts/iransens/IRANSansWeb_Bold.woff2') format('woff2'); font-weight:600 900; font-style:normal; font-display:swap }
      .app-route-loading { min-height:100dvh; display:grid; place-content:center; justify-items:center; gap:20px; overflow:hidden; padding:24px; color:#2d2835; background:radial-gradient(circle at 50% 44%,rgba(124,58,237,.1),transparent 26rem),linear-gradient(145deg,#faf8ff,#fff); text-align:center; font-family:IRANSansWeb,Tahoma,Arial,sans-serif }
      .app-route-loading__visual { position:relative; width:128px; height:128px; display:grid; place-items:center }
      .app-route-loading__visual:before { content:""; position:absolute; inset:18px; border:1px solid rgba(109,40,217,.18); border-radius:50% }
      .app-route-loading__visual svg { position:relative; z-index:1; width:64px; height:64px; filter:drop-shadow(0 12px 22px rgba(109,40,217,.2)) }
      .app-route-loading__orbit { position:absolute; inset:4px; border:3px solid transparent; border-top-color:#6d28d9; border-inline-end-color:rgba(109,40,217,.32); border-radius:50%; animation:danoa-initial-orbit .95s linear infinite }
      .app-route-loading__content { display:grid; justify-items:center; gap:7px }
      .app-route-loading strong { font-size:clamp(1rem,2.5vw,1.18rem); font-weight:850 }
      .app-route-loading__content>span:not(.app-route-loading__progress) { color:#6f687a; font-size:.875rem }
      .app-route-loading__progress { display:block; width:112px; height:3px; margin-top:7px; overflow:hidden; border-radius:999px; background:rgba(109,40,217,.12) }
      .app-route-loading__progress:after { content:""; display:block; width:48%; height:100%; border-radius:inherit; background:#6d28d9; animation:danoa-initial-progress 1.1s ease-in-out infinite }
      @keyframes danoa-initial-orbit { to { transform:rotate(360deg) } }
      @keyframes danoa-initial-progress { from { transform:translateX(-120%) } to { transform:translateX(230%) } }
      @media (prefers-reduced-motion:reduce) { .app-route-loading__orbit,.app-route-loading__progress:after { animation:none } .app-route-loading__progress:after { width:100%; transform:none } }
    </style>
