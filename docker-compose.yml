services:
  mysql:
    image: hub.hamdocker.ir/library/mariadb:10.11
    container_name: chatbot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chatbot}
      MYSQL_USER: ${MYSQL_USER:-chatbot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      IMAGE_STORAGE_DIR: /var/lib/danoa/generated-images
      CONVERSATION_MEMORY_STORAGE_DIR: /var/lib/danoa/conversation-memory
      VIDEO_INPUT_STORAGE_ROOT: /var/lib/danoa/video-inputs
      VIDEO_STORAGE_ROOT: /var/lib/danoa/video-results
      VIDEO_STORAGE_TEMP_ROOT: /var/lib/danoa/video-results/.tmp
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - app-uploads:/app/backend/uploads
      - ./data/generated-images:/var/lib/danoa/generated-images
      - ./data/conversation-memory:/var/lib/danoa/conversation-memory
      - video-inputs:/var/lib/danoa/video-inputs
      - video-results:/var/lib/danoa/video-results

volumes:
  mysql-data:
  app-uploads:
  video-inputs:
  video-results:
